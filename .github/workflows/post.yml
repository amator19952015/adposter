name: Daily ad post
on:
  schedule:
    # GitHub запускает cron с опозданием (бывает 30-50 минут), поэтому стартуем заранее,
    # а post.py сам ждёт ровно до 11:05 по Бухаресту. Лишние запуски сами себя пропускают.
    - cron: "40 7 * * *"   # лето (UTC+3): 10:40 / зима (UTC+2): 09:40 - слишком рано, пропуск
    - cron: "40 8 * * *"   # зима: 10:40 - основной / лето: 11:40 - запасной
    - cron: "10 9 * * *"   # зима: 11:10 - запасной, если основной не сработал
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать прямо сейчас, не дожидаясь 11:00"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: ad-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon
      - name: Publish
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python post.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
      - name: Keep schedule alive (GitHub отключает cron после 60 дней без коммитов)
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > last_run.txt
          git config user.name "adposter-bot"
          git config user.email "adposter-bot@users.noreply.github.com"
          git add last_run.txt
          git add posted.txt 2>/dev/null || true
          git commit -m "last run $(cat last_run.txt)" || exit 0
          git push
